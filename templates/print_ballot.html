<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>列印選票 - {{ committee.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; margin: 0; }
        }
        .ballot-box {
            border: 2px solid #000;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
        }
        .grid-ballot {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .cell-ballot {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
            height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .circle-stamp {
            width: 32px;
            height: 32px;
            border: 2px dashed #666;
            border-radius: 50%;
            margin: 5px auto 0;
        }
    </style>
</head>
<body class="bg-light p-4">

    <div class="no-print text-center mb-4">
        <button onclick="window.print()" class="btn btn-primary btn-lg fw-bold">
            <i class="fa-solid fa-print me-2"></i>列印選票
        </button>
    </div>

    <div class="ballot-box bg-white">
        <div class="text-center mb-4 border-bottom pb-3">
            <h2 class="fw-bold">{{ committee.title }} 正式選票</h2>
            <p class="mb-1 fs-5">應選名額：<strong>{{ committee.seats_count }}</strong> 人 | 圈選上限：<strong>{{ committee.max_votes_per_ballot }}</strong> 人</p>
            <small class="text-muted">請使用圈選章蓋於候補人下方圈選欄內，塗改無效。</small>
        </div>

        <div class="grid-ballot">
            {% for c in candidates %}
            <div class="cell-ballot">
                <div class="fw-bold fs-5">#{{ c.candidate_number }} {{ c.name }}</div>
                <div class="small text-muted">({{ c.gender }})</div>
                <div class="circle-stamp"></div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
